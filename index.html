<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Stock</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin Controls Toolbar Styling */
        .admin-bar {
            text-align: center;
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
        .admin-btn {
            padding: 8px 16px;
            margin: 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-toggle { background-color: #6c757d; color: white; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-export { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        .qty-controls { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #fff; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- ADMIN TOOLBAR -->
    <div class="admin-bar">
        <button id="toggle-edit-btn" class="admin-btn btn-toggle" onclick="toggleEditMode()">⚙️ Mode Édition</button>
        <span id="edit-controls" style="display: none;">
            <button class="admin-btn btn-add" onclick="addNewItem()">➕ Ajouter un produit</button>
            <button class="admin-btn btn-export" onclick="exportCatalog()">📥 Exporter le code JSON</button>
        </span>
    </div>

    <!-- SECTION 1: THE MAIN PRODUCT GRID -->
    <div id="grid-view">
        <div id="product-grid" class="product-grid"></div>
    </div>

    <!-- SECTION 2: THE DETAIL VIEW (Hidden by default) -->
    <div id="detail-view" style="display: none;">
        <button class="back-button" onclick="showGrid()">← Retour au catalogue</button>
        
        <div class="detail-container">
            <div class="detail-images">
                <!-- Big Main Photo -->
                <img id="detail-main-img" src="" alt="Main Image">
                
                <!-- PLACE 1: Extra pictures container -->
                <div id="detail-thumbnails" class="thumbnails-container"></div>
            </div>
            
            <div class="detail-info">
                <h1 id="detail-title"></h1>
                <div id="detail-qty" class="qty-badge" style="display:inline-block; margin: 10px 0;"></div>
                
                <!-- PLACE 2: Technical Specs Description text -->
                <p id="detail-desc" class="detail-description"></p>
            </div>
        </div>
    </div>

    <script>
        // DATA ARRAY: Where you change your items, descriptions, and pictures
        const products = [
          {
            "name": "Acer veriton x4640g",
            "quantity": 6,
            "description": "I5-6éme génération, 256Go SSD, 8Go RAM, Windows 10 PRO version 21H1+activation, OFFICE 2010, PORT:VGA\\Display\\DVI\\Reseau\\USB\\DB9\\PS2, Graveur DVD",
            "image": "image/ACER.png",
            "gallery": ["image/ACER.png"]
          },
          {
            "name": "HP Desktop + Monitor",
            "quantity": 1,
            "description": "I7-12éme génération, 500Go NVME, 8Go RAM, Windows 11 PRO version 21H2+activation, OFFICE 2010, PORT:VGA\\HDMI\\Reseau\\USB, Graveur DVD, Clavier, Souris, Cable alimentation, Ecran 21,5\"",
            "image": "image/HP.png",
            /* --- WHERE TO ADD EXTRA HP PICTURES --- */
            "gallery": ["image/HP.png"] 
          },
          {
            "name": "Acer V226HQL",
            "quantity": 13,
            "description": "21,5\" PORT:VGA\\DVI",
            "image": "image/ACER2.webp",
            "gallery": ["image/ACER2.webp"]
          },
          {
            "name": "HP V24vG5",
            "quantity": 3,
            "description": "24\" PORT:VGA\\HDMI",
            "image": "image/HP 24.jpg",
            "gallery": ["image/HP 24.jpg"]
          },
          {
            "name": "ThinkVision S22i-30",
            "quantity": 2,
            "description": "22\" PORT:VGA\\HDMI",
            "image": "image/THINKVISION.jpg",
            "gallery": ["image/THINKVISION.jpg"] 
          },
          {
            "name": "DELL Monitor",
            "quantity": 2,
            "description": "21,5\" PORT:VGA\\HDMI",
            "image": "image/DELL.jpg",
            "gallery": ["image/DELL.jpg"]
          },
          {
            "name": "DELL E2016HV",
            "quantity": 3,
            "description": "19,5\" PORT:VGA",
            "image": "image/Ecran-DELL E2016HV.jpg",
            "gallery": ["image/Ecran-DELL E2016HV.jpg"]
          },
          {
            "name": "LENOVO D19-10",
            "quantity": 3,
            "description": "18,5\" PORT:VGA\\HDMI",
            "image": "image/LENOVO D19-10.jpg",
            "gallery": ["image/LENOVO D19-10.jpg"]
          }, 
          {
            "name": "DELL",
            "quantity": 1,
            "description": "I3-13éme génération, 256Go SSD, 8Go RAM, Windows 11 PRO version 21H2+activation, OFFICE 2010, PORT:Display\\HDMI\\Reseau\\USB, Graveur DVD,",
            "image": "image/DELL VOSTRO.jpg",
            "gallery": ["image/DELL VOSTRO.jpg"]
          },
          {
            "name": "HP",
            "quantity": 1,
            "description": "I3-12éme génération, 256Go SSD, 8Go RAM, Windows 11 PRO version 21H2+activation, OFFICE 2010, PORT:VGA\\HDMI\\Reseau\\USB, Graveur DVD, Clavier, Souris, Cable alimentation, Ecran 21,5\"",
            "image": "image/HP.png",
            "gallery": ["image/HP.png"]
          },
          {
            "name": "Shuttle mini pc de bureau",
            "quantity": 1,
            "description": "Intel Pentium G4400-6éme génération, 128Go NVME, 8Go RAM, Windows 10 PRO version 22H2+activation, PORT:Display\\HDMI\\PS2\\deux port reseau\\deux port DB9\\usb, transformateur DC",
            "image": "image/shuttle1.jpg", 
            "gallery": ["image/shuttle1.jpg", "image/shuttle.jpg"]
          },
          {
            "name": "Keyboard jeway",
            "quantity": 70,
            "description": "Keyboard K1 AZERTY+ARAB",
            "image": "image/jeway.jpg",
            "gallery": ["image/jeway.jpg"]
          },
          {
            "name": "Keyboard K-HP01",
            "quantity": 32,
            "description": "Keyboard K-HP01 AZERTY+ARAB",
            "image": "image/KHP01.png",
            "gallery": ["image/KHP01.png"]
          },
          {
            "name": "Keyboard DELL",
            "quantity": 1,
            "description": "Keyboard DELL AZERTY+ARAB",
            "image": "image/clavier dell.png",
            "gallery": ["image/clavier dell.png"]
          },
          {
            "name": "Keyboard HP+souris",
            "quantity": 1,
            "description": "Keyboard HP qwerty",
            "image": "image/Clavier HP.jpg",
            "gallery": ["image/Clavier HP.jpg"]
          },
          {
            "name": "SOURIS",
            "quantity": 94,
            "description": "USB ENIGMA GYM01",
            "image": "image/souris.png",
            "gallery": ["image/souris.png"]
          },
        ];

        let isEditMode = false;

        // 1. Render items to the front page grid
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            products.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="product-card" onclick="handleCardClick(event, ${index})">
                        <div class="image-wrapper">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <p class="product-title">${item.name}</p>
                        <div class="qty-badge">Quantité: ${item.quantity}</div>
                        
                        ${isEditMode ? `
                            <div class="qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="adjustQty(${index}, 1)">+</button>
                                <button class="qty-btn" onclick="adjustQty(${index}, -1)">-</button>
                                <button class="btn-danger" onclick="deleteItem(${index})">🗑️ Supprimer</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function handleCardClick(event, index) {
            if (!isEditMode) {
                showDetails(index);
            }
        }

        // Toggle Edit Mode UI
        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.getElementById('edit-controls').style.display = isEditMode ? 'inline' : 'none';
            document.getElementById('toggle-edit-btn').innerText = isEditMode ? '🔒 Quitter Mode Édition' : '⚙️ Mode Édition';
            renderProducts();
        }

        // Increase / Decrease Quantity
        function adjustQty(index, amount) {
            if (products[index].quantity + amount >= 0) {
                products[index].quantity += amount;
                renderProducts();
            }
        }

        // Delete Item
        function deleteItem(index) {
            if (confirm(`Voulez-vous vraiment supprimer "${products[index].name}" ?`)) {
                products.splice(index, 1);
                renderProducts();
            }
        }

        // Add New Item
        function addNewItem() {
            const name = prompt("Nom du produit:");
            if (!name) return;
            const quantity = parseInt(prompt("Quantité initial:", "1")) || 0;
            const description = prompt("Description technique:", "");
            const imagePath = prompt("Chemin de l'image (ex: image/nom.jpg):", "image/");

            products.push({
                "name": name,
                "quantity": quantity,
                "description": description,
                "image": imagePath,
                "gallery": [imagePath]
            });

            renderProducts();
        }

        // Export Array Data to Clipboard
        function exportCatalog() {
            const jsonText = JSON.stringify(products, null, 12);
            navigator.clipboard.writeText(`const products = ${jsonText};`);
            alert("Le code 'products' à jour a été copié dans le presse-papier ! Vous pouvez le coller directement dans VS Code.");
        }

        // Initial Page Render
        renderProducts();

        // 2. Click Logic: Hide catalog grid, build detail view strings, show details section
        function showDetails(index) {
            const item = products[index];
            
            // Set text details from the array dataset
            document.getElementById('detail-title').innerText = item.name;
            document.getElementById('detail-qty').innerText = "Quantité: " + item.quantity;
            document.getElementById('detail-desc').innerText = item.description;
            
            // Set main image view
            const mainImg = document.getElementById('detail-main-img');
            mainImg.src = item.image;

            // Generate extra gallery images clickable buttons
            const thumbsContainer = document.getElementById('detail-thumbnails');
            thumbsContainer.innerHTML = '';
            
            if(item.gallery && item.gallery.length > 1) {
                item.gallery.forEach(imgUrl => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = 'thumb-img';
                    thumb.onclick = () => { mainImg.src = imgUrl; };
                    thumbsContainer.appendChild(thumb);
                });
            }

            // View Layout View Swapping
            document.getElementById('grid-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
        }

        // 3. Return Logic: Hide detail screen, show main grid layout view back
        function showGrid() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'block';
        }
    </script>
</body>
</html>
